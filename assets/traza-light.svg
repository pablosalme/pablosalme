<title id="t">Traza de una ejecución del orquestador</title>
<desc id="d">El orquestador delega tres tareas en claude, codex y opencode, cada uno en su rama y su worktree. Después otro modelo revisa los cambios, pasan los evals y los guardrails y las ramas se integran en main.</desc>
